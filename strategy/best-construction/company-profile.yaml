  - {id: paving,                 label: "Asphalt / parking-lot paving",                       self_performed: TBD,  public_works_ready: TBD}
  - {id: pavers,                 label: "Pavers (patio, pool deck, commercial)",              self_performed: true, public_works_ready: TBD}
  - {id: patios_hardscape,       label: "Patios, courtyards and hardscape",                   self_performed: true, public_works_ready: TBD}
