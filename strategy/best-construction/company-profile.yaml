segments:
  # Which services each segment may be pitched. The `best-construction-segments`
  # skill, when installed, is the authority on pitch angle and pricing tiers;
  # keep this mapping consistent with it.
  # --- Engine 1: Commercial / Public ---
  home_builders:        [outdoor_living_program]
  general_contractors:  [driveways, pavers, demolition, excavation]
  developers:           [demolition, patios_hardscape, pavers]
  commercial_property:  [paving, concrete, sidewalks_walkways, ada_exterior, demolition, excavation]
  public_agencies:      [demolition, excavation, grading, concrete, sidewalks_walkways, ada_exterior, paving, pavers, build_remodel]
  utilities_infrastructure: [excavation, grading, concrete, demolition]
  # --- Engine 2: Residential ---
  residential_homeowners: [concrete, driveways, pavers, patios_hardscape, retaining_walls, excavation, grading,
                           demolition, land_clearing, drainage, adu_site_prep, build_remodel, outdoor_living_residential]
  # --- Engine 3: Property Management / HOA / Multifamily ---
  property_managers_hoas_multifamily: [concrete, sidewalks_walkways, ada_exterior, paving, pavers, retaining_walls,
                                       drainage, grading, excavation, demolition, land_clearing, patios_hardscape,
                                       fences_exterior, exterior_renovation, build_remodel, emergency_repairs]

lead_engines:
