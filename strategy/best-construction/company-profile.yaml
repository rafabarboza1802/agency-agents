# Best Construction Inc. — company configuration
#
# Single source of truth for every agent in the construction/ division.
# Agents READ this file; they never hard-code licences, limits, crews or
# qualifications. Update facts here, not in the agent prompts.
#
# Lookup order used by every BC agent:
#   1. $BC_COMPANY_PROFILE (absolute path), if set
#   2. ./strategy/best-construction/company-profile.yaml (agents run inside this repo)
#   3. ~/.claude/best-construction/company-profile.yaml (agents installed globally)
# If none is readable, the agent stops and asks for the missing facts.
#
# Conventions:
#   - A value of null or "TBD" means UNKNOWN. Agents must treat unknown values as
#     a blocker for any decision that depends on them (e.g. bonding limit unknown
#     => no go/no-go on a bonded public bid) and list them as open questions.
#   - "verified_on" dates let agents warn when a fact is stale (> 365 days, or
#     past an expiry date).
#   - Never put passwords, API keys, bank details or SSNs in this file.

